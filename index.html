<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora TypeScript CI/CD</title>
</head>
<body>
  <h1>Calculadora =)</h1>

  <input type="number" id="num1" placeholder="Primer número" />
  <select id="operation">
    <option value="sum">+</option>
    <option value="subtract">&minus;</option>
    <option value="multiply">&times;</option>
    <option value="divide">&divide;</option>
  </select>
  <input type="number" id="num2" placeholder="Segundo número" />
  <button type="button" id="btnCalc">Calcular</button>

  <p>Resultado: <strong id="result">—</strong></p>

  <!-- Compiled JS (compile with: npm run build) -->
  <script src="sum.js"></script>
  <script src="subtract.js"></script>
  <script src="multiply.js"></script>
  <script src="divide.js"></script>
  <script>
    document.getElementById('btnCalc').addEventListener('click', function () {
      var a = Number(document.getElementById('num1').value) || 0;
      var b = Number(document.getElementById('num2').value) || 0;
      var op = document.getElementById('operation').value;
      var output = document.getElementById('result');

      try {
        var operations = {
          sum: window.sum,
          subtract: window.subtract,
          multiply: window.multiply,
          divide: window.divide
        };
        output.textContent = operations[op](a, b);
      } catch (error) {
        output.textContent = 'Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
